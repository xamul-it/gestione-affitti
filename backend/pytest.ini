[pytest]
# Pytest configuration for Gestione Affitti backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Test package directories must have unique leaf names across unit/ and
# integration/: pytest's default import mode registers them by basename in
# sys.modules, so two dirs both named e.g. test_anagrafica collide with
# "ModuleNotFoundError: No module named 'test_anagrafica.xxx'" when the whole
# suite runs in one invocation. Unit packages use a _unit suffix
# (tests/unit/test_modules/test_anagrafica_unit/).

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    -ra

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, database required)
    e2e: End-to-end tests (slowest, full stack)
    slow: Slow running tests
    tenant: Tests related to multi-tenancy
    parsing: Tests related to document parsing
    security: Security-related tests
    module_anagrafica: Tests for the anagrafica_italiana module

# Asyncio configuration
asyncio_mode = auto

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
