[pytest]
# Pytest configuration for Gestione Affitti backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# KNOWN LIMITATION (pre-existing, unrelated to any specific feature): pytest's
# default import mode registers test packages by basename in sys.modules, so
# two different test-package directories sharing the same leaf name (e.g.
# tests/unit/test_modules/test_anagrafica/ and
# tests/integration/test_modules/test_anagrafica/) collide with
# "ModuleNotFoundError: No module named 'test_anagrafica.xxx'" when collected
# in the SAME pytest invocation. This was previously masked by an unregistered
# `module_anagrafica` marker aborting collection before it could surface.
# Workaround until this is properly fixed (either --import-mode=importlib,
# tested and found to break other things when tried in isolation, or unique
# leaf directory names per test type): run unit and integration suites for
# the same module in separate pytest invocations, not combined in one command.

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    -ra

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, database required)
    e2e: End-to-end tests (slowest, full stack)
    slow: Slow running tests
    tenant: Tests related to multi-tenancy
    parsing: Tests related to document parsing
    security: Security-related tests
    module_anagrafica: Tests for the anagrafica_italiana module

# Asyncio configuration
asyncio_mode = auto

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
